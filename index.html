<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Avin Quest: a playable pixel-art RPG version of Avin Gaur's CV.">
<title>Avin Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: full-screen canvas world, HTML overlays for text (dialogue, panels, mini-games). Single deliberate dusk palette. */
:root{
  --night:#100f1d;      /* page ground */
  --ink:#1a1830;        /* panel fill */
  --ink2:#26234a;       /* raised panel */
  --line:#3d3870;       /* panel rules */
  --paper:#f5ead2;      /* text */
  --muted:#b8afd6;      /* secondary text */
  --gold:#f4b740;       /* accent: achievements, primary actions */
  --teal:#4cc7ad;       /* success */
  --rose:#ef7470;       /* error / hint */
  --sky:#7fb6ff;        /* fiction label */
  --display:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --body:'VT323', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--night);color:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);font-size:20px;-webkit-user-select:none;user-select:none;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .18s}
.px-panel{background:var(--ink);border:3px solid var(--paper);box-shadow:0 0 0 3px #07060f,6px 6px 0 3px rgba(0,0,0,.45);border-radius:2px}
button{font-family:var(--display);font-size:10px;line-height:1.4;color:var(--night);background:var(--gold);border:0;padding:10px 12px;cursor:pointer;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),0 0 0 2px #07060f;border-radius:1px}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
button.ghost{background:var(--ink2);color:var(--paper)}
button.small{font-size:9px;padding:7px 9px}
button:disabled{opacity:.45;cursor:not-allowed}

/* HUD */
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud > *{pointer-events:auto}
#loc{padding:8px 10px;min-width:0}
#loc .t{font-family:var(--display);font-size:9px;color:var(--gold);letter-spacing:.06em}
#loc .n{font-size:22px;line-height:1;margin-top:4px}
#btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#btns button{font-size:8px;padding:8px 8px;background:var(--ink2);color:var(--paper)}
#btns button .k{color:var(--gold)}
#tracker{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 72px);max-width:min(300px,calc(100% - 20px));padding:8px 10px;font-size:19px;line-height:1.1;pointer-events:none}
#tracker .h{font-family:var(--display);font-size:8px;color:var(--muted);margin-bottom:5px}
#tracker .o{display:flex;gap:6px}
#tracker .o span:first-child{flex:none}
#tracker .o.d{color:var(--teal)}
#tracker .q{color:var(--gold);margin-bottom:3px}
#help{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-family:var(--display);font-size:8px;color:var(--muted);background:rgba(16,15,29,.7);padding:6px 10px;white-space:nowrap;pointer-events:none}

/* prompt bubble */
#prompt{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-size:8px;background:var(--paper);color:var(--night);padding:5px 7px;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 2px #07060f;display:flex;gap:6px;align-items:center}
#prompt .key{background:var(--night);color:var(--gold);padding:2px 4px}
#prompt::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-4px;border:4px solid transparent;border-top-color:var(--paper)}

/* dialogue */
#dlg{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(760px,calc(100% - 24px));display:flex;gap:12px;padding:12px;align-items:flex-start}
#dlg canvas{width:72px;height:72px;image-rendering:pixelated;background:var(--ink2);flex:none;box-shadow:0 0 0 2px var(--line)}
#dlg .body{flex:1;min-width:0}
#dlg .nm{font-family:var(--display);font-size:10px;color:var(--gold);margin-bottom:6px}
#dlg .tx{font-size:23px;line-height:1.15;min-height:54px}
#dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.tag{display:inline-block;font-family:var(--display);font-size:7px;padding:3px 5px;vertical-align:middle;letter-spacing:.04em}
.tag.fic{background:var(--sky);color:var(--night)}
.tag.real{background:var(--teal);color:var(--night)}
.tag.fun{background:#c49bff;color:var(--night)}

/* modal */
#modal{position:absolute;inset:0;background:rgba(8,7,16,.72);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
#mbox{width:min(780px,100%);max-height:100%;overflow:auto;padding:18px 18px 16px;-webkit-user-select:text;user-select:text;touch-action:pan-y}
#mbox h2{font-family:var(--display);font-size:13px;line-height:1.5;color:var(--gold);margin:0 0 4px;text-wrap:balance}
#mbox h3{font-family:var(--display);font-size:10px;color:var(--paper);margin:16px 0 8px;line-height:1.5}
#mbox p{margin:6px 0;font-size:21px;line-height:1.15;max-width:65ch}
#mbox .sub{color:var(--muted)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.grid{display:grid;gap:10px}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--ink2);padding:10px 12px;box-shadow:0 0 0 2px var(--line);min-width:0}
.card .ct{font-family:var(--display);font-size:9px;color:var(--gold);margin-bottom:6px;line-height:1.5}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:19px;line-height:1.1}
.card dt{color:var(--muted)}
.card dd{margin:0}
.card.sel{box-shadow:0 0 0 3px var(--gold)}
.card.ok{box-shadow:0 0 0 3px var(--teal)}
.card.bad{box-shadow:0 0 0 3px var(--rose)}
.fb{margin-top:10px;padding:10px 12px;font-size:20px;line-height:1.15;background:var(--ink2);border-left:4px solid var(--muted)}
.fb.ok{border-color:var(--teal)}
.fb.bad{border-color:var(--rose)}
.opt{display:block;width:100%;text-align:left;font-family:var(--body);font-size:21px;line-height:1.1;background:var(--ink2);color:var(--paper);padding:9px 12px;margin:6px 0;box-shadow:0 0 0 2px var(--line)}
.opt.ok{box-shadow:0 0 0 3px var(--teal)}
.opt.bad{box-shadow:0 0 0 3px var(--rose)}
.opt.on{box-shadow:0 0 0 3px var(--gold)}
ul.cv{margin:8px 0 0;padding-left:20px;font-size:21px;line-height:1.15}
ul.cv li{margin:5px 0}
ul.cv li::marker{color:var(--gold)}
.reveal-head{display:flex;gap:14px;align-items:center}
.reveal-head canvas{width:64px;height:64px;image-rendering:pixelated;flex:none}
.role{font-size:22px}
.dates{color:var(--muted);font-size:19px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:18px;line-height:1}
.badge canvas{width:48px;height:48px;image-rendering:pixelated}
.badge.locked canvas{filter:grayscale(1) brightness(.45)}
.badge.locked span{color:#6e6890}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--display);font-size:8px;padding:6px 8px;background:var(--ink2);box-shadow:0 0 0 2px var(--line)}
.chip.on{background:var(--teal);color:var(--night);box-shadow:none}

/* toasts */
#toasts{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 64px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 8px;animation:tin .35s steps(5) both}
.toast canvas{width:40px;height:40px;image-rendering:pixelated}
.toast .a{font-family:var(--display);font-size:7px;color:var(--gold)}
.toast .b{font-size:21px;line-height:1}
.toast.out{animation:tout .3s steps(4) both}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}
@keyframes tout{to{transform:translateX(130%)}}

/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(16,15,29,.35),rgba(16,15,29,.78))}
#title h1{font-family:var(--display);font-size:clamp(28px,7vw,64px);line-height:1.1;margin:0;color:var(--gold);text-shadow:4px 4px 0 #6b2c1a,8px 8px 0 #07060f;letter-spacing:.02em}
#title .st{font-size:clamp(22px,3.2vw,30px);color:var(--paper);text-shadow:2px 2px 0 #07060f}
#title .by{font-family:var(--display);font-size:9px;color:var(--muted);text-shadow:2px 2px 0 #07060f}
#title .tb{display:flex;flex-direction:column;gap:10px;min-width:min(260px,100%)}
#title .tb button{font-size:11px;padding:13px 16px}
.blink{animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}

/* touch controls */
#touch{position:absolute;inset:auto 0 0 0;height:0;pointer-events:none}
#dpad{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:138px;height:138px;pointer-events:auto}
#dpad button{position:absolute;width:46px;height:46px;padding:0;font-size:12px;background:rgba(38,35,74,.85);color:var(--paper)}
#dpad .u{left:46px;top:0}#dpad .d{left:46px;top:92px}#dpad .l{left:0;top:46px}#dpad .r{left:92px;top:46px}
#abtn{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:72px;height:72px;border-radius:50%;font-size:14px;pointer-events:auto}

/* scheduler */
.tl{position:relative;height:30px;background:#14122a;box-shadow:0 0 0 2px var(--line);margin:4px 0 12px}
.tl .bar{position:absolute;top:4px;bottom:4px;font-family:var(--display);font-size:7px;color:var(--night);display:flex;align-items:center;padding:0 4px;overflow:hidden;white-space:nowrap}
.tl .bar.x{outline:3px solid var(--rose)}
.ticks{display:flex;justify-content:space-between;font-size:16px;color:var(--muted)}
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.srow .nm{flex:1;min-width:150px;font-size:21px}
.srow button.on{background:var(--teal)}
/* landing page mock */
.lp{background:#fbf7ee;color:#222;font-family:system-ui,sans-serif;padding:12px;font-size:13px;line-height:1.3;box-shadow:0 0 0 2px var(--line);min-width:0}
.lp .nav{display:flex;justify-content:space-between;font-size:10px;color:#777;margin-bottom:10px}
.lp .hl{font-size:17px;font-weight:700;line-height:1.15;margin-bottom:8px}
.lp .fs{display:grid;gap:4px;margin-bottom:10px}
.lp .fs div{background:#ece6d8;padding:5px 7px;font-size:12px}
.lp .cta{display:inline-block;background:#2f6fde;color:#fff;padding:6px 10px;font-weight:600;font-size:12px}
.lp.before .hl{font-size:14px;color:#555}
.lp.before .cta{background:#999}
/* bars */
.chart{display:flex;align-items:flex-end;gap:10px;height:190px;padding:10px 10px 0;background:#14122a;box-shadow:0 0 0 2px var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;min-width:0;background:none;padding:0;box-shadow:none;border-radius:0;font-family:var(--body);color:var(--paper)}
.chart .col .v{font-size:18px}
.chart .col .bb{width:70%;background:var(--sky);box-shadow:inset -3px 0 0 rgba(0,0,0,.25)}
.chart .col:hover .bb{background:var(--gold)}
.chart .col.ok .bb{background:var(--teal)}
.chart .col.bad .bb{background:var(--rose)}
.xl{display:flex;gap:10px;padding:4px 10px 0}
.xl span{flex:1;text-align:center;font-size:16px;color:var(--muted);line-height:1;min-width:0}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{background:var(--ink2);color:var(--paper)}
.tabs button.on{background:var(--gold);color:var(--night)}
table.dt{border-collapse:collapse;width:100%;font-size:19px}
table.dt td,table.dt th{padding:3px 8px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt th{font-family:var(--display);font-size:7px;color:var(--muted);font-weight:normal}
table.dt td:first-child,table.dt th:first-child{text-align:left}
.scroll{overflow-x:auto}
.mini{width:100%;image-rendering:pixelated;box-shadow:0 0 0 2px var(--line);display:block}
.travel{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}
.travel button{font-size:8px;text-align:left;display:flex;justify-content:space-between;gap:6px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:22px}
.copyrow code{font-family:var(--body);background:var(--ink2);padding:2px 8px;-webkit-user-select:all;user-select:all}
a{color:var(--sky)}
@media (prefers-reduced-motion:reduce){.toast,.toast.out,.blink{animation:none}#fade{transition:none}}
</style>

</head>
<body>
<div id="app" tabindex="0" aria-label="Avin Quest game">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div id="loc" class="px-panel"><div class="t">AVIN QUEST</div><div class="n" id="locn">Avin Town</div></div>
    <div id="btns">
      <button id="bJ" aria-label="Quest journal"><span class="k">J</span> Journal</button>
      <button id="bP" aria-label="Character profile"><span class="k">P</span> Profile</button>
      <button id="bM" aria-label="Town map"><span class="k">M</span> Map</button>
      <button id="bS" aria-label="Toggle sound">Sound: on</button>
      <button id="bE" aria-label="Menu"><span class="k">Esc</span> Menu</button>
    </div>
  </div>
  <div id="tracker" class="px-panel" hidden></div>
  <div id="help" hidden>WASD / ARROWS: MOVE &nbsp; E / SPACE: INTERACT &nbsp; J: JOURNAL &nbsp; M: MAP</div>
  <div id="prompt" hidden></div>
  <div id="toasts"></div>
  <div id="touch" hidden>
    <div id="dpad"><button class="u" data-k="up" aria-label="Up">&#9650;</button><button class="l" data-k="left" aria-label="Left">&#9664;</button><button class="r" data-k="right" aria-label="Right">&#9654;</button><button class="d" data-k="down" aria-label="Down">&#9660;</button></div>
    <button id="abtn" aria-label="Interact">E</button>
  </div>
  <div id="dlg" class="px-panel" hidden>
    <canvas id="dpor" width="24" height="24"></canvas>
    <div class="body"><div class="nm" id="dnm"></div><div class="tx" id="dtx"></div>
      <div class="row"><button class="ghost small" id="dskip">Skip</button><button class="small" id="dnext">Next &#9656;</button></div></div>
  </div>
  <div id="title">
    <h1>AVIN QUEST</h1>
    <div class="st">One Guy. Many Adventures. Too Many Side Quests.</div>
    <div class="tb">
      <button id="tStart">Start Adventure</button>
      <button id="tCont" class="ghost" hidden>Continue Adventure</button>
      <button id="tHow" class="ghost">How to Play</button>
    </div>
    <div id="tWarn" class="by" hidden>Starting over clears your saved progress. <button id="tYes" class="small">Start over</button></div>
    <div class="by">An interactive CV of Avin Gaur &middot; about 5 minutes</div>
  </div>
  <div id="modal" hidden><div id="mbox" class="px-panel" role="dialog" aria-modal="true"></div></div>
  <div id="fade"></div>
</div>

<script>
'use strict';
/* =====================================================================
   CONTENT — personal facts and game text. Edit here; no gameplay code.
   Real facts come from Avin's CV. Mini-game businesses are fictional.
   ===================================================================== */
const PROFILE = {
  name: 'Avin Gaur',
  email: 'avingaur.iitd@gmail.com',
  linkedin: 'https://www.linkedin.com/in/avin-gaur/',
  cvUrl: '', // paste a public link to your CV PDF here to show a "Download CV" button
  whyWispr: [
    "I dictated the brief for this game with Wispr Flow. Talking was faster than typing, and the words came out sounding like me. That's the whole pitch, and I bought it.",
    "Growth is where the things in this town meet: understanding users like a product person, reading the numbers like an analyst, and testing ideas fast like a founder.",
    "India is a huge, multilingual market where speaking may be the most natural way to write. I'd love to help work out how Wispr Flow wins it."
  ]
};

const BUILDINGS = {
  iit:      { name:'IIT Delhi',          lobby:'lobby_iit',      rooms:['academics','bnc','placement','arena','classroom','community'] },
  startup:  { name:'Startup Garage',     lobby:'lobby_startup',  rooms:['glexica','wootz'] },
  vc:       { name:'Venture Capital',    lobby:'lobby_vc',       rooms:['campus','mounttech'] },
  consult:  { name:'Consulting Office',  lobby:'lobby_consult',  rooms:['kepler'] },
  research: { name:'Research Lab',       lobby:'lobby_research', rooms:['haas'] },
  future:   { name:'Future Lab',         lobby:'future',         rooms:[] }
};

const QUESTS = {
  academics:{ b:'iit', name:'Academics', plaque:'ACADEMICS', title:'Three Curious Things', ach:'Curious Mind', icon:'book', color:'#4f86e0', skills:['Curiosity','Research'],
    objs:[{id:'items',text:'Find 3 things on the desks that sum Avin up',n:3}],
    reveal:{org:'IIT Delhi',role:'B.Tech, Textile Technology',dates:'Jul 2023 – May 2027',lines:[
      'CGPA 8.05/10',
      'Summer Undergraduate Research Award: an INR 25k+ grant from IRD, IIT Delhi for a research initiative (2026)',
      'Alongside the degree: consulting, venture capital, startups and research, as the rest of this town shows']}},
  bnc:{ b:'iit', name:'Business & Consulting Club', plaque:'BNC CLUB', title:'Kick Off a Project', ach:'Team Builder', icon:'people', color:'#e0884f', skills:['Leadership'],
    objs:[{id:'docs',text:'Collect the brief, roster and plan',n:3},{id:'deliver',text:'Hand them to the project lead',n:1}],
    reveal:{org:'Business & Consulting Club, IIT Delhi',role:'Vice President',dates:'Apr 2026 – Present',lines:[
      'Led outreach to 50+ startups, setting up the club’s startup projects vertical and onboarding an Accel-backed fintech venture',
      'Partnered with 7+ clubs and 5+ colleges to make onboarding for inter-college case study projects smoother']}},
  placement:{ b:'iit', name:'Placement Office', plaque:'PLACEMENT', title:'Placement Day Chaos', ach:'Operations Master', icon:'cal', color:'#58b368', skills:['Operations'],
    objs:[{id:'sched',text:'Schedule 3 companies with no clashes',n:1}],
    reveal:{org:'Office of Career Services, IIT Delhi',role:'Student Placement Executive',dates:'May 2024 – May 2025',lines:[
      'Headed placement drive days: 10+ companies, 50+ offers, a 70% increase on the previous year',
      'Awarded Best Contribution by the IIT Delhi Senate for coordinating institute-wide training and placement activities']}},
  arena:{ b:'iit', name:'Competition Arena', plaque:'ARENA', title:'Trophy Stories', ach:'Competitive Spirit', icon:'trophy', color:'#e2b33b', skills:['Entrepreneurship','Analytical Thinking'],
    objs:[{id:'stories',text:'Read 3 trophy stories',n:3}],
    reveal:{org:'Competitions',role:'Wins and placings',dates:'',lines:[
      'Winner, AIdeate (GPAI Turing Korea): top 3% in a global AI-based case competition',
      'Winner, Eightfold.ai Hackathon (IIT Kanpur): built a High-Trust Talent Intelligence platform',
      'Winner, FYCF Contest (BECon’25, eDC IIT Delhi): startup and business pitch ideas',
      'Top 6, Inter IIT Tech 14.0: part of the IIT Delhi contingent placed 6th among 23+ IITs']}},
  classroom:{ b:'iit', name:'Classroom of Change', plaque:'CLASSROOM', title:'Speak Up for the Class', ach:'Student Advocate', icon:'mega', color:'#cf5d7a', skills:['Leadership'],
    objs:[{id:'feedback',text:'Collect feedback from students',n:2},{id:'faculty',text:'Take it to the faculty advisor',n:1}],
    reveal:{org:'Co-Curricular and Academic Interaction Council, IIT Delhi',role:'Class Representative',dates:'Jul 2024 – Apr 2025',lines:[
      'Helped bring about a grading policy revision that lowered requirements by two grade units, enabling 10+ students to pass',
      'Acted as the link between students and faculty, contributing to better grading policies across batches']}},
  community:{ b:'iit', name:'Community Corner', plaque:'COMMUNITY', title:'Giving Back', ach:'Community Contributor', icon:'heart', color:'#e86a8e', skills:['Leadership'],
    objs:[{id:'mentor',text:'Talk to the community mentor',n:1},{id:'records',text:'Read the volunteering records',n:2}],
    reveal:{org:'Volunteering',role:'Bachpan Program and UBA Khurrampur',dates:'',lines:[
      'Bachpan Program: mentored 10+ underprivileged students in academic concepts',

  const st=qs(id); st.started=true; const ob=QUESTS[id].objs.find(x=>x.id===o);
  st.p[o]=Math.min(ob.n,(st.p[o]||0)+1); Snd.get(); save(); updateTracker();

function buildTown(){
  const W=36,H=30; const tile=new Array(W*H).fill('g'); const solid=new Uint8Array(W*H);
  const set=(x0,y0,x1,y1,v)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) tile[y*W+x]=v; };
  set(2,10,33,11,'p'); set(10,12,25,17,'s'); set(6,9,7,9,'p'); set(17,7,18,9,'p'); set(28,9,29,9,'p');
  set(10,18,11,23,'p'); set(24,18,25,23,'p'); set(2,24,33,25,'p'); set(28,13,32,16,'w');
  const isP=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&(tile[y*W+x]==='p'||tile[y*W+x]==='s');
  const occ=new Uint8Array(W*H); // reserved cells
  TOWN_B.forEach(b=>{ for(let y=b.y;y<b.y+b.h;y++) for(let x=b.x;x<b.x+b.w;x++){ solid[y*W+x]=1; occ[y*W+x]=1; }
    const dy=b.y+b.h-1; if(b.id!=='future'||futureOpen()){ solid[dy*W+b.door]=0; solid[dy*W+b.door+1]=0; } });
  for(let i=0;i<W*H;i++) if(tile[i]==='w') solid[i]=1;
  const props=[], npcs=[], zones=[];
  const add=(p)=>{ props.push(p); if(p.solid!==false) for(let y=p.y;y<p.y+(p.h||1);y++) for(let x=p.x;x<p.x+(p.w||1);x++) solid[y*W+x]=1; for(let y=p.y-1;y<=p.y+(p.h||1);y++) for(let x=p.x-1;x<=p.x+(p.w||1);x++) if(x>=0&&y>=0&&x<W&&y<H) occ[y*W+x]=1; };
  add({t:'fountain',x:17,y:14,w:2,h:2,act:()=>sayLines('Fountain',[ 'A sign reads: "Toss a coin, make a wish." Someone has tossed in a sticky note that says "more hours in the day".'],null,'fun'),label:'Look'});
  add({t:'bench',x:11,y:13,w:2}); add({t:'bench',x:23,y:13,w:2});
  add({t:'bikes',x:1,y:9,w:3,label:'Look at the cycles',act:()=>sayLines('Cycle Stand',['A row of bicycles outside the Main Building. On a campus this size, a cycle is how you make it to an 8 a.m. class on time. Mostly.'],null,'fun')});
  add({t:'chaicart',x:9,y:9,w:2,label:'Visit the chai stall',act:()=>{ Snd.get(); sayLines('Chai Stall',['Ten rupees a cup. Open whenever there is a deadline, which means always.','You gained +1 Focus. (It does nothing. It’s chai.)'],null,'fun'); }});
  add({t:'flag',x:11,y:9});
  [[12,12],[23,12],[12,17],[23,17]].forEach(([x,y])=>add({t:'lamp',x,y}));
  add({t:'board',x:13,y:12,w:2,label:'Read notice board',act:noticeBoard});
  add({t:'sign',x:21,y:12,text:'AVIN TOWN',label:'Read sign',act:()=>sayLines('Town Sign',['North: Future Lab (locked until 4 rooms are done). Northwest: IIT Delhi. Northeast: Startup Garage.','South side: Venture Capital, Research Lab and the Consulting Office. Press M any time to fast-travel.'])});
  npcs.push({id:'guide',x:15,y:16,dir:'right',look:LOOKS.guide,name:'Tara, Town Guide',talk:talkGuide});
  npcs.push({id:'recruiter',x:22,y:15,dir:'left',look:LOOKS.recruiter,name:'Visiting Recruiter',talk:()=>sayLines('Visiting Recruiter',[
    'So a Textile Technology student ends up in consulting, venture capital, startups AND research?',
    'My theory: textiles is about turning raw material into something useful through a lot of process. Seems he applied that to everything else too.',
    "Anyway, I'm here for the Future Lab. I hear it opens once you've seen four rooms."],LOOKS.recruiter,'fun')});
  npcs.push({id:'locke',x:20,y:7,dir:'down',look:LOOKS.robot,name:'LOCK-E',talk:()=>{ const n=doneCount();
    sayLines('LOCK-E', futureOpen()? ['Access granted. Avin is waiting inside the Future Lab.'] : [`Beep. The Future Lab is locked.`,`Complete any ${UNLOCK_AT} rooms to open it. Progress: ${n}/${UNLOCK_AT}.`],LOOKS.robot); }});
  npcs.forEach(n=>{ for(let y=n.y-1;y<=n.y+1;y++) for(let x=n.x-1;x<=n.x+1;x++) occ[y*W+x]=1; });
  // trees
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x; if(tile[i]!=='g'||occ[i]) continue;
    const border = y===0||x===0||x===W-1||y>=H-3; let near=false; for(let yy=y-1;yy<=y+1;yy++) for(let xx=x-1;xx<=x+1;xx++) if(isP(xx,yy)||(xx>=0&&yy>=0&&xx<W&&yy<H&&tile[yy*W+xx]==='w')) near=true;
    if(border || (!near && hash(x,y)<0.16)){ props.push({t:'tree',x,y,v:Math.floor(hash(y,x)*3)}); solid[i]=1; occ[i]=1; }
    else if(!near && hash(x+9,y+3)<0.08){ props.push({t:'bush',x,y}); solid[i]=1; occ[i]=1; } }
  npcs.forEach(n=>solid[n.y*W+n.x]=1);
  TOWN_B.forEach(b=>{ const dy=b.y+b.h-1; const B=BUILDINGS[b.id];
    if(b.id==='future' && !futureOpen()) return;
    const L = b.id==='future'? SCENE_DEFS.future() : LOBBIES[B.lobby];
    zones.push({x:b.door*T,y:dy*T,w:2*T,h:T,label:'Enter '+B.name, go:{scene:B.lobby, x:(L.exitX+1)*T, y:(L.h-2)*T+12, dir:'up'}}); });
  // static layer
  const c=document.createElement('canvas'); c.width=W*T; c.height=H*T; const g=c.getContext('2d');
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const v=tile[y*W+x]; if(v==='p') drawPath(g,x,y,isP); else if(v==='s') drawStone(g,x,y); else if(v==='w') drawWater(g,x,y); else drawGrass(g,x,y); }
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ if(tile[y*W+x]==='g' && !occ[y*W+x] && !solid[y*W+x] && hash(x*3,y*5)<0.12){ const X=x*T,Y=y*T; [[3,5],[10,9],[6,12]].forEach(([a,b2],i)=>{ R(g,X+a,Y+b2,2,2,['#f2e86a','#ef7470','#fff6e2'][(x+y+i)%3]); R(g,X+a,Y+b2+2,1,2,'#3f8a45'); }); } }
  // pond edge
  for(let y=13;y<=16;y++){ R(g,28*T-2,y*T,2,T,'#5a9643'); R(g,33*T,y*T,2,T,'#5a9643'); } R(g,28*T,13*T-2,5*T,2,'#5a9643'); R(g,28*T,17*T,5*T,2,'#5a9643');
  return {id:'town',name:'Avin Town',kind:'town',W,H,ground:c,solid,props,npcs,zones,bg:'#2f6a35',buildings:TOWN_B};
}

function iitMap(){ const W=30,H=20; const m=[...Array(H)].map(()=>Array(W).fill('.'));
  const rect=(x0,y0,x1,y1,c)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) m[y][x]=c; };
  rect(0,0,W-1,0,'#'); rect(0,0,0,H-1,'#'); rect(W-1,0,W-1,H-1,'#'); rect(0,H-1,W-1,H-1,'#');
  rect(1,1,W-2,2,'w');
  rect(1,10,7,17,':');            // canteen lounge
  rect(8,13,21,18,'r');           // reception
  rect(1,6,7,7,'#'); rect(1,8,7,9,'w');       // BnC club block
  rect(22,6,28,7,'#'); rect(22,8,28,9,'w');   // OCS block

  rect(10,6,19,11,'h'); rect(11,7,18,10,'c'); rect(14,6,15,6,'c'); rect(14,11,15,11,'c'); // open courtyard

  return m.map(r=>r.join('')); }

  let tx,ty,label,key='E'; if(target){ tx=target.x; ty=target.y; label=target.label; } else if(nearZone){ tx=nearZone.x+nearZone.w/2; ty=nearZone.py!=null?nearZone.py:nearZone.y-(scene.id==='town'?30:2); label=nearZone.label; key=nearZone.locked?'':'WALK IN'; if(scene.kind!=='town'&&nearZone.y>T*2&&nearZone.py==null) ty=nearZone.y-4; } else { promptEl.hidden=true; return; }
  promptEl.innerHTML=(key?`<span class="key">${key}</span>`:'')+esc(label); promptEl.hidden=false;
  const r=cv.getBoundingClientRect(); let sx=(tx-cam.x)*SC+r.left, sy=(ty-cam.y)*SC+r.top;
  sx=clamp(sx,90,innerWidth-90); sy=clamp(sy,40,innerHeight-10); promptEl.style.left=sx+'px'; promptEl.style.top=sy+'px'; }
function updateTracker(){ const el=$('#tracker'); if(mode!=='play'||!scene){ el.hidden=true; return; } el.hidden=false;
  let h='';
  if(scene.kind==='room'){ const q=QUESTS[scene.id], st=qs(scene.id);
    h=`<div class="h">QUEST</div><div class="q">${esc(q.title)}</div>`+q.objs.map(o=>{ const n=st.p[o.id]||0, d=n>=o.n; return `<div class="o${d?' d':''}"><span>${d?'[x]':'[ ]'}</span><span>${esc(o.text)}${o.n>1?` (${n}/${o.n})`:''}</span></div>`; }).join('')+(st.done?'<div class="o d">Done! Exit at the bottom door.</div>':'');
  } else { const n=doneCount();
    h=`<div class="h">PROGRESS</div>`;
    if(!S.guide) h+=`<div class="q">Talk to Tara, the town guide</div>`;
    h+=`<div class="o${n>=UNLOCK_AT?' d':''}"><span>${n>=UNLOCK_AT?'[x]':'[ ]'}</span><span>Rooms explored: ${n}/${ROOM_IDS.length}</span></div>`;
    h+= futureOpen()? (S.ach.includes('future')?`<div class="o d"><span>[x]</span><span>Future Lab visited</span></div>`:`<div class="q">The Future Lab is open! Head north.</div>`) : `<div class="o"><span>[ ]</span><span>Future Lab opens at ${UNLOCK_AT} rooms</span></div>`;
    if(scene.kind==='lobby'){ const B=BUILDINGS[LOBBIES[scene.id].b]; const dn=B.rooms.filter(r=>S.q[r]&&S.q[r].done).length; h+=`<div class="o"><span>&gt;</span><span>This building: ${dn}/${B.rooms.length} rooms</span></div>`; }
  }
  el.innerHTML=h; const hb=$('#hud').getBoundingClientRect(); el.style.top=(hb.bottom+8)+'px'; $('#toasts').style.top=(hb.bottom+8)+'px'; }

let dq=[], dcur=null, dshown=0, dtimer=null, dcb=null;
function sayLines(name,lines,look,tag,cb){ say(lines.map(t=>({n:name,t,look,tag})),cb); }
function say(lines,cb){ dq=lines.slice(); dcb=cb||null; dlgOpen=true; $('#dlg').hidden=false; hidePrompt(); nextLine(); }
function nextLine(){ if(dtimer){ clearInterval(dtimer); dtimer=null; }
  if(!dq.length){ closeDlg(); return; } dcur=dq.shift();
  $('#dnm').innerHTML=esc(dcur.n)+(dcur.tag==='fic'?' <span class="tag fic">FICTIONAL</span>':dcur.tag==='fun'?' <span class="tag fun">GAME HUMOUR</span>':dcur.tag==='real'?' <span class="tag real">FROM THE CV</span>':'');
  const pc=$('#dpor'), pg=pc.getContext('2d'); pg.clearRect(0,0,24,24); R(pg,0,0,24,24,'#26234a');
  if(dcur.look){ pc.style.visibility='visible'; pg.save(); pg.translate(0,0); drawChar(pg,12,22,'down',0,dcur.look,0,false); pg.restore(); } else { pc.style.visibility='visible'; drawIcon(pg,dcur.tag==='real'?'book':dcur.tag==='fun'?'star':'magnify',5,5,'#f4b740',2); }
  dshown=0; const tx=$('#dtx'); tx.textContent=''; const full=dcur.t;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ tx.textContent=full; dshown=full.length; return; }
  dtimer=setInterval(()=>{ dshown+=2; tx.textContent=full.slice(0,dshown); if(dshown%6===0) Snd.talk(); if(dshown>=full.length){ clearInterval(dtimer); dtimer=null; } },22); }
function advance(){ if(!dlgOpen) return; if(dtimer){ clearInterval(dtimer); dtimer=null; $('#dtx').textContent=dcur.t; dshown=dcur.t.length; return; } Snd.blip(); nextLine(); }
function closeDlg(){ if(dtimer){ clearInterval(dtimer); dtimer=null; } $('#dlg').hidden=true; dlgOpen=false; dq=[]; const cb=dcb; dcb=null; if(scene&&scene.kind==='room') qs(scene.id).talked=true; if(cb) setTimeout(cb,60); }
function skipDlg(){ dq=[]; if(dtimer){ clearInterval(dtimer); dtimer=null; } closeDlg(); }
$('#dnext').onclick=advance; $('#dskip').onclick=skipDlg;

function openPlacement(){
  const cos=[{n:'Quantloom',a:10,b:12,c:'#e3a43c'},{n:'Bluebirch Analytics',a:11,b:13,c:'#5aa0e8'},{n:'Tandoor Robotics',a:12,b:14,c:'#e8735a'}];
  const asg=[null,null,null]; let msg='', ok=false;
  const conflicts=()=>{ const out=[]; for(let i=0;i<3;i++) for(let j=i+1;j<3;j++) if(asg[i]&&asg[i]===asg[j]&&cos[i].a<cos[j].b&&cos[j].a<cos[i].b) out.push([i,j]); return out; };
  const draw=()=>{ const cf=conflicts(), bad=new Set(cf.flat());
    const tl=room=>`<div class="ticks"><span>${room}</span></div><div class="tl">${cos.map((c,i)=>asg[i]===room?`<div class="bar${bad.has(i)?' x':''}" style="left:${(c.a-10)/4*100}%;width:${(c.b-c.a)/4*100}%;background:${c.c}">${esc(c.n)}</div>`:'').join('')}</div>`;
    openModal(`<h2>Placement Day Chaos ${fictionTag}</h2><p class="sub">Three companies, two interview rooms. Put each company in a room so no two interviews in the same room overlap.</p>
      ${cos.map((c,i)=>`<div class="srow"><span class="nm" style="color:${c.c}">${esc(c.n)} <span class="sub">${c.a}:00–${c.b}:00</span></span><button class="small ${asg[i]==='Room A'?'on':'ghost'}" data-i="${i}" data-r="Room A">Room A</button><button class="small ${asg[i]==='Room B'?'on':'ghost'}" data-i="${i}" data-r="Room B">Room B</button></div>`).join('')}
      <h3>TIMELINE</h3><div class="ticks"><span>10:00</span><span>11:00</span><span>12:00</span><span>13:00</span><span>14:00</span></div>${tl('Room A')}${tl('Room B')}
      ${msg?`<div class="fb ${ok?'ok':'bad'}">${msg}</div>`:''}
      <div class="mfoot"><button class="ghost" id="mX">Close</button><button id="mGo" ${asg.includes(null)?'disabled':''}>${ok?'Continue':'Lock schedule'}</button></div>`);
    $('#mbox').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ if(ok) return; asg[+b.dataset.i]=b.dataset.r; msg=''; Snd.blip(); draw(); });
    $('#mX').onclick=closeModal;
    $('#mGo').onclick=()=>{ if(ok){ closeModal(); progress('placement','sched','pl_s'); return; }
      const cf=conflicts(); if(cf.length){ const [i,j]=cf[0]; msg=`${cos[i].n} and ${cos[j].n} are both in ${asg[i]} and overlap ${Math.max(cos[i].a,cos[j].a)}:00–${Math.min(cos[i].b,cos[j].b)}:00. Try moving one.`; Snd.bad(); }
      else { ok=true; msg='No clashes. Quantloom finishes at 12:00 just as Tandoor starts, so they can share a room. That’s placement day ops: small puzzles, many times over.'; Snd.get(); }
      draw(); }; };
  draw(); }

function openGlexica(){ if(qs('glexica').done) return sayLines('Landing Page',['Fixed and shipped. Visitors get it in three seconds now.']);
  qs('glexica').started=true;
  const H=[{t:'Synergistic AI-powered next-gen paradigm platform',ok:false,f:'Lots of buzzwords, but what does it actually do?'},{t:'Turn sales calls into follow-up notes in seconds',ok:true,f:'Clear. A visitor knows what it does and why it matters.'},{t:'Welcome to our website!',ok:false,f:'Friendly, but it says nothing about the product.'}];
  const F=[{t:'Auto-summaries after every call',ok:true},{t:'Action items synced to your CRM',ok:true},{t:'Works in 20+ languages',ok:true},{t:'Our logo now has a dark mode',ok:false},{t:'Founded in a hostel room',ok:false},{t:'The office has a slide',ok:false}];
  const C=[{t:'Submit',ok:false,f:'Submit what? Buttons should say what happens next.'},{t:'Start free, no card needed',ok:true,f:'Clear, low-risk, and tells people what happens next.'},{t:'Learn more about our journey',ok:false,f:'Nice story, but it sends people away from trying the product.'}];
  let step=0, h=null, fs=new Set(), c=null, msg='', ok=false;
  const page=(before)=>`<div class="lp ${before?'before':''}"><div class="nav"><b>NoteNest</b><span>Pricing &middot; Login</span></div>
    <div class="hl">${esc(before?H[0].t:H[h].t)}</div><div class="fs">${(before?[F[4],F[3],F[5]]:[...fs].map(i=>F[i])).map(f=>`<div>${esc(f.t)}</div>`).join('')}</div><span class="cta">${esc(before?C[0].t:C[c].t)}</span></div>`;
  const draw=()=>{ let body='';
    if(step===0) body=`<h3>STEP 1 OF 3: PICK A HEADLINE</h3>${H.map((x,i)=>`<button class="opt ${h===i?(x.ok?'ok':'bad'):''}" data-h="${i}">${esc(x.t)}</button>`).join('')}`;
    if(step===1) body=`<h3>STEP 2 OF 3: PICK 3 FEATURES TO SHOW FIRST</h3><p class="sub">Show what matters to a sales team. ${fs.size}/3 picked.</p>${F.map((x,i)=>`<button class="opt ${fs.has(i)?'on':''}" data-f="${i}">${esc(x.t)}</button>`).join('')}`;
    if(step===2) body=`<h3>STEP 3 OF 3: PICK THE BUTTON TEXT</h3>${C.map((x,i)=>`<button class="opt ${c===i?(x.ok?'ok':'bad'):''}" data-c="${i}">${esc(x.t)}</button>`).join('')}`;
    if(step===3) body=`<h3>BEFORE AND AFTER</h3><div class="grid g2"><div><div class="sub" style="margin-bottom:4px">Before</div>${page(true)}</div><div><div class="sub" style="margin-bottom:4px">After</div>${page(false)}</div></div><div class="fb ok">A clear headline, the features buyers care about, and one obvious next step. Avin did this for real at Glexica after studying 50+ YC startup landing pages.</div>`;
    openModal(`<h2>Fix the Landing Page ${fictionTag}</h2><p class="sub">NoteNest is a made-up AI notes tool. Its landing page confuses visitors. Fix it in three steps.</p>${body}${msg?`<div class="fb ${ok?'ok':'bad'}">${esc(msg)}</div>`:''}
      <div class="mfoot"><button class="ghost" id="mX">Close</button>${step===1?`<button id="mF" ${fs.size===3?'':'disabled'}>Check features</button>`:''}${(step<3&&ok)?'<button id="mN">Next step</button>':''}${step===3?'<button id="mD">Ship it</button>':''}</div>`);
    const mb=$('#mbox');
    mb.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ h=+b.dataset.h; msg=H[h].f; ok=H[h].ok; ok?Snd.get():Snd.bad(); draw(); });
    mb.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ c=+b.dataset.c; msg=C[c].f; ok=C[c].ok; ok?Snd.get():Snd.bad(); draw(); });
    mb.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.f; if(fs.has(i)) fs.delete(i); else if(fs.size<3) fs.add(i); msg=''; ok=false; Snd.blip(); draw(); });
    $('#mX').onclick=closeModal;
    if($('#mF')) $('#mF').onclick=()=>{ const bad=[...fs].filter(i=>!F[i].ok); if(bad.length){ msg=`"${F[bad[0]].t}" is fun, but a buyer doesn’t care. Swap it for something that helps them decide.`; ok=false; Snd.bad(); } else { msg='Exactly the three things a sales team would want to know.'; ok=true; Snd.get(); } draw(); };
    if($('#mN')) $('#mN').onclick=()=>{ step++; msg=''; ok=false; draw(); };
    if($('#mD')) $('#mD').onclick=()=>{ closeModal(); progress('glexica','page','gx'); }; };
  draw(); }

    ${pick!=null?`<div class="fb ok"><b>${esc(PS[pick].n)}</b>: ${esc(PS[pick].f)} Every pick trades off market size, how the business makes money, and what could go wrong.</div>`:''}
    <div class="mfoot"><button class="ghost" id="mX">Close</button>${pick!=null?'<button id="mD">Write the memo</button>':''}</div>`);
    $('#mbox').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ pick=+b.dataset.p; Snd.get(); draw(); });
    $('#mX').onclick=closeModal; if($('#mD')) $('#mD').onclick=()=>{ closeModal(); progress('campus','pick','cf'); }; };
  draw(); }

const MT={
  sky:{n:'SkyRelay',d:'Long-endurance drones for border surveillance.',opts:['Long government buying cycles and certification','Not enough followers on social media','The drones are too quiet'],a:0,f:'Defence buyers move slowly and need certification. A startup can run out of money while waiting for its first order.'},
  orbit:{n:'OrbitForge',d:'3D-printed engine parts for small rockets.',opts:['The office is too far from the airport','Proving reliability through costly qualification testing','Rockets are going out of fashion'],a:1,f:'Nobody flies a part that hasn’t been qualified. Testing is slow and expensive, and it has to happen before any revenue.'},
  shop:{n:'ShopSense',d:'Sensors that predict machine breakdowns on factory floors (Industry 4.0).',opts:['The sensors are too small to see','Factories don’t have Wi-Fi in the cafeteria','Getting cautious factories to change how they work and connect old machines'],a:2,f:'The tech works in a pilot. The hard part is getting a busy factory to change its routine and connect decades-old machines.'}};
function openMount(id){ const s=MT[id]; qs('mounttech').started=true;
  if(S.flags['mt_'+id]) return sayLines(s.n,['File reviewed. '+s.f]);
  let pick=null;
  const draw=()=>{ openModal(`<h2>Startup File: ${esc(s.n)} ${fictionTag}</h2><p>${esc(s.d)}</p><h3>WHAT’S THE BIGGEST RISK TO SELLING THIS?</h3>
    ${s.opts.map((o,i)=>`<button class="opt ${pick===i?(i===s.a?'ok':'bad'):''}" data-o="${i}">${esc(o)}</button>`).join('')}
    ${pick!=null?`<div class="fb ${pick===s.a?'ok':'bad'}">${pick===s.a?esc(s.f):'Probably not the big one. Think about who buys this and what they need before they say yes.'}</div>`:''}
    <div class="mfoot"><button class="ghost" id="mX">Close</button>${pick===s.a?'<button id="mD">File it</button>':''}</div>`);
    $('#mbox').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ pick=+b.dataset.o; pick===s.a?Snd.get():Snd.bad(); draw(); });
    $('#mX').onclick=closeModal; if($('#mD')) $('#mD').onclick=()=>{ closeModal(); progress('mounttech','files','mt_'+id); }; };
  draw(); }

function openKepler(){ if(qs('kepler').done) return sayLines('Dashboard',['The leak is flagged. Next stop: the SteerCo deck.']);
  qs('kepler').started=true;
  const D=[{s:'Mass Retail',acc:'412k',b:820,w:90},{s:'Mass Affluent',acc:'96k',b:540,w:65},{s:'Small Business',acc:'38k',b:610,w:55},{s:'Premier',acc:'21k',b:430,w:250},{s:'Students',acc:'130k',b:120,w:17}];
  let tab='b', pick=null, tries=0;
  const draw=()=>{ const val=d=>tab==='b'?d.b:Math.round(d.w/d.b*100); const mx=Math.max(...D.map(val));
    openModal(`<h2>The Missing Revenue Mystery ${fictionTag}</h2><p class="sub">Fictional Bank of Avin Town. Customers are up, fee income is flat. Compare the segments and click the one that looks wrong.</p>
    <div class="tabs"><button class="small ${tab==='b'?'on':''}" data-t="b">Fees billed ($K)</button><button class="small ${tab==='w'?'on':''}" data-t="w">Fees waived (% of billed)</button></div>
    <div class="chart">${D.map((d,i)=>`<button class="col ${pick===i?(i===3?'ok':'bad'):''}" data-s="${i}" aria-label="${d.s}"><span class="v">${val(d)}${tab==='w'?'%':''}</span><span class="bb" style="height:${Math.max(4,val(d)/mx*150)}px"></span></button>`).join('')}</div>
    <div class="xl">${D.map(d=>`<span>${d.s}</span>`).join('')}</div>
    <h3>DATA</h3><div class="scroll"><table class="dt"><tr><th>SEGMENT</th><th>ACCOUNTS</th><th>BILLED $K</th><th>WAIVED $K</th></tr>${D.map(d=>`<tr><td>${d.s}</td><td>${d.acc}</td><td>${d.b}</td><td>${d.w}</td></tr>`).join('')}</table></div>
    ${pick!=null?`<div class="fb ${pick===3?'ok':'bad'}">${pick===3?'Premier waives 58% of the fees it bills, against 9–14% everywhere else. Some waivers are deliberate perks, but this is where you’d check whether they follow policy. Money the bank should collect but doesn’t: that’s revenue leakage.':'Looks normal next to the others.'+(tab==='b'?' Try the "Fees waived" view.':'')+(tries>=2?' Hint: look at the tallest bar in the waived view.':'')}</div>`:''}
    <div class="mfoot"><button class="ghost" id="mX">Close</button>${pick===3?'<button id="mD">Add to SteerCo deck</button>':''}</div>`);
    $('#mbox').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; Snd.blip(); draw(); });
    $('#mbox').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ pick=+b.dataset.s; if(pick!==3){ tries++; Snd.bad(); } else Snd.get(); draw(); });
    $('#mX').onclick=closeModal; if($('#mD')) $('#mD').onclick=()=>{ closeModal(); progress('kepler','leak','kp'); }; };
  draw(); }

function openHaas(){ if(qs('haas').done) return sayLines('Survey Board',['Hypothesis recorded. Next: test it in the field.']);
  qs('haas').started=true;
  const O=['9 in 10 households in Sundarpur received an LPG connection and a stove.','Most of them still cook mainly on firewood, which they collect for free.','A refill costs ₹900 paid all at once, but most families earn small amounts day by day.'];
  const A=[{t:'People don’t know what LPG is',f:'They already own LPG stoves, so awareness isn’t the issue.'},{t:'Paying for a full refill in one go doesn’t match how families earn',ok:true,f:'Right. Firewood is free and a refill needs a big lump sum. A researcher would test this, for example by offering smaller refills or different ways to pay, then comparing how usage changes across groups.'},{t:'LPG stoves don’t work well in villages',f:'Nothing in the observations points to the stove failing.'},{t:'Food cooked on firewood tastes different',f:'Could be part of it, but observation 3 points to something stronger.'}];
  let pick=null;
  const draw=()=>{ openModal(`<h2>The Energy Puzzle ${fictionTag}</h2><p class="sub">Sundarpur is a made-up village. Read the three observations, then pick the most likely barrier.</p>
    <div class="grid" style="margin-top:8px">${O.map((o,i)=>`<div class="card"><div class="ct">OBSERVATION ${i+1}</div><p style="margin:0">${esc(o)}</p></div>`).join('')}</div>
    <h3>WHAT’S MOST LIKELY HOLDING THEM BACK?</h3>${A.map((a,i)=>`<button class="opt ${pick===i?(a.ok?'ok':'bad'):''}" data-a="${i}">${esc(a.t)}</button>`).join('')}
    ${pick!=null?`<div class="fb ${A[pick].ok?'ok':'bad'}">${esc(A[pick].f)}</div>`:''}
    <div class="mfoot"><button class="ghost" id="mX">Close</button>${pick!=null&&A[pick].ok?'<button id="mD">Write it up</button>':''}</div>`);
    $('#mbox').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ pick=+b.dataset.a; A[pick].ok?Snd.get():Snd.bad(); draw(); });
    $('#mX').onclick=closeModal; if($('#mD')) $('#mD').onclick=()=>{ closeModal(); progress('haas','puzzle','hs'); }; };
  draw(); }

/* ===================== panels: journal, profile, map, menu, final ===================== */
function allAch(){ return [...ROOM_IDS.map(id=>({id,name:QUESTS[id].ach,icon:QUESTS[id].icon,color:QUESTS[id].color})), ...Object.entries(EXTRA_ACH).map(([id,a])=>({id,...a}))]; }
function badgesHTML(){ return `<div class="badges">${allAch().map(a=>`<div class="badge ${S.ach.includes(a.id)?'':'locked'}"><canvas data-b="${a.id}" width="16" height="16"></canvas><span>${S.ach.includes(a.id)?esc(a.name):'???'}</span></div>`).join('')}</div>`; }
function paintBadges(){ const all=allAch(); $('#mbox').querySelectorAll('canvas[data-b]').forEach(c=>{ const a=all.find(x=>x.id===c.dataset.b); c.getContext('2d').drawImage(badgeCanvas(a.icon,a.color),0,0); }); }
function openJournal(){ if(busy()&&!modalOpen) return;
  const rows=Object.entries(BUILDINGS).filter(([k,b])=>b.rooms.length).map(([k,b])=>`<h3>${esc(b.name.toUpperCase())}</h3>`+b.rooms.map(id=>{ const q=QUESTS[id], st=S.q[id]||{p:{}}; const status=st.done?'<span class="tag real">DONE</span>':st.started?'<span class="tag fic">IN PROGRESS</span>':'<span class="tag" style="background:#3d3870">NOT STARTED</span>';
    return `<div class="card" style="margin-bottom:8px"><div class="ct">${esc(q.title)} ${status}</div><div class="sub" style="font-size:18px">${esc(q.name)}</div>${st.started&&!st.done?q.objs.map(o=>{ const n=(st.p&&st.p[o.id])||0; return `<div style="font-size:19px">${n>=o.n?'[x]':'[ ]'} ${esc(o.text)}${o.n>1?` (${n}/${o.n})`:''}</div>`; }).join(''):''}${st.done?`<div style="font-size:19px;color:var(--teal)">Badge: ${esc(q.ach)}</div>`:''}</div>`; }).join('')).join('');
  openModal(`<h2>Quest Journal</h2><p class="sub">${doneCount()} of ${ROOM_IDS.length} rooms complete. ${futureOpen()?'The Future Lab is open.':`The Future Lab opens at ${UNLOCK_AT}.`}</p>${rows}<div class="mfoot"><button id="mX">Close</button></div>`); $('#mX').onclick=closeModal; }
function openProfile(){ const shown={}; ROOM_IDS.forEach(id=>{ if(S.q[id]&&S.q[id].done) QUESTS[id].skills.forEach(s=>(shown[s]=shown[s]||[]).push(QUESTS[id].name)); });
  openModal(`<h2>Avin — Character Profile</h2><p class="sub">Skills unlock as you complete rooms. No made-up stats: each skill lists the rooms where you saw it in action.</p>
    <div class="grid g2" style="margin-top:10px">${SKILLS.map(s=>`<div class="card ${shown[s]?'ok':''}"><div class="ct">${shown[s]?esc(s.toUpperCase()):'LOCKED SKILL'}</div><div style="font-size:19px" class="${shown[s]?'':'sub'}">${shown[s]?'Seen in: '+shown[s].map(esc).join(', '):'Complete more rooms to reveal it.'}</div></div>`).join('')}</div>
    <h3>BADGES (${S.ach.length}/${allAch().length})</h3>${badgesHTML()}<div class="mfoot"><button id="mX">Close</button></div>`); paintBadges(); $('#mX').onclick=closeModal; }
function openMap(){ const town=buildTown(); const c=document.createElement('canvas'); c.width=town.W*T; c.height=town.H*T; const g=c.getContext('2d'); g.drawImage(town.ground,0,0);
  town.props.forEach(p=>{ if(p.t==='tree'||p.t==='bush'){ R(g,p.x*T+1,p.y*T-3,14,15,'#07060f'); R(g,p.x*T+2,p.y*T-2,12,13,p.t==='tree'?'#3f8a45':'#5fae55'); } }); TOWN_B.forEach(b=>{ g.drawImage(spr('b_'+b.id+(b.id==='future'?futureOpen():'')+bDone(b.id),b.w*T+8,b.h*T+24,gg=>drawBuilding(gg,b)),b.x*T-4,b.y*T-24); });
  if(scene.id==='town'){ R(g,P.x-4,P.y-8,8,8,'#07060f'); R(g,P.x-3,P.y-7,6,6,'#f4b740'); }
  const btn=b=>{ const B=BUILDINGS[b.id]; const dn=B.rooms.filter(r=>S.q[r]&&S.q[r].done).length; const lock=b.id==='future'&&!futureOpen();
    return `<button class="ghost" data-tb="${b.id}" ${lock?'disabled':''}><span>${esc(B.name)}</span><span>${b.id==='future'?(lock?`${doneCount()}/${UNLOCK_AT}`:'OPEN'):`${dn}/${B.rooms.length}`}</span></button>`; };
  openModal(`<h2>Town Map</h2><p class="sub">Fast-travel to any building’s front door.</p><div id="mapimg"></div><div class="travel">${TOWN_B.map(btn).join('')}</div><div class="mfoot"><button id="mX">Close</button></div>`);
  c.className='mini'; $('#mapimg').appendChild(c);
  $('#mbox').querySelectorAll('[data-tb]').forEach(b=>b.onclick=()=>{ const tb=TOWN_B.find(x=>x.id===b.dataset.tb); closeModal(); goTo({scene:'town',x:(tb.door+1)*T,y:(tb.y+tb.h)*T+12,dir:'up'}); });
  $('#mX').onclick=closeModal; }
function howToHTML(){ return `<h2>How to Play</h2>
  <div class="grid g2" style="margin-top:8px"><div class="card"><div class="ct">MOVE</div><p style="margin:0">WASD or arrow keys. On a phone, use the pad in the corner.</p></div>
  <div class="card"><div class="ct">INTERACT</div><p style="margin:0">E or Space to talk and inspect. Walk into a door to go through it.</p></div>
  <div class="card"><div class="ct">GOAL</div><p style="margin:0">Each building is a chapter of Avin’s life, and each room is a short quest. Finish any ${UNLOCK_AT} rooms to open the Future Lab.</p></div>
  <div class="card"><div class="ct">SHORTCUTS</div><p style="margin:0">J journal, P profile, M map and fast travel, Esc menu. Progress saves automatically in this browser.</p></div></div>
  <p class="sub" style="margin-top:10px"><span class="tag real">FROM THE CV</span> marks Avin’s real experience. <span class="tag fic">FICTIONAL</span> and <span class="tag fun">GAME HUMOUR</span> mark made-up companies, data and jokes.</p>`; }
function openMenu(){ openModal(`<h2>Menu</h2><div class="grid" style="margin-top:12px;max-width:340px">
  <button id="m1">Resume</button><button class="ghost" id="m2">How to play</button><button class="ghost" id="m3">Back to title</button><button class="ghost" id="m4">Reset progress</button><div id="m5" class="sub" hidden style="font-size:19px">This clears every quest and badge. <button class="small" id="m6">Yes, reset</button></div></div>`);
  $('#m1').onclick=closeModal; $('#m2').onclick=()=>{ openModal(howToHTML()+'<div class="mfoot"><button id="mX">Back</button></div>'); $('#mX').onclick=closeModal; };
  $('#m3').onclick=()=>{ save(); closeModal(); toTitle(); }; $('#m4').onclick=()=>{ $('#m5').hidden=false; };
  $('#m6').onclick=()=>{ wipe(); closeModal(); toTitle(); }; }
function showFinal(){ const done=ROOM_IDS.filter(id=>S.q[id]&&S.q[id].done);
  openModal(`<div class="tag real">THE END (FOR NOW)</div><h2 style="margin-top:8px;font-size:15px">Thanks for playing Avin Quest</h2>
    <p class="sub">You explored ${done.length} of ${ROOM_IDS.length} rooms and earned ${S.ach.length} of ${allAch().length} badges. The rest of town is still open if you want to keep exploring.</p>
    <h3>BADGES</h3>${badgesHTML()}
    <h3>WHAT YOU DISCOVERED</h3><div class="card"><ul class="cv">${done.map(id=>`<li><b>${esc(QUESTS[id].reveal.role)}</b>, ${esc(QUESTS[id].reveal.org)}</li>`).join('')||'<li>Nothing yet. Go explore!</li>'}</ul></div>
    <h3>WHY WISPR FLOW</h3><div class="card">${PROFILE.whyWispr.map(p=>`<p style="margin:4px 0 8px">${esc(p)}</p>`).join('')}</div>
    <h3>GET IN TOUCH</h3><div class="card"><div class="copyrow"><span>Email</span><code id="em">${esc(PROFILE.email)}</code><button class="small" id="cp">Copy</button></div>
    <div class="copyrow" style="margin-top:8px"><span>LinkedIn</span><a href="${esc(PROFILE.linkedin)}" target="_blank" rel="noopener">${esc(PROFILE.linkedin.replace('https://www.',''))}</a></div>
    ${PROFILE.cvUrl?`<div style="margin-top:10px"><a href="${esc(PROFILE.cvUrl)}" target="_blank" rel="noopener"><button class="small">Open CV (PDF)</button></a></div>`:''}</div>
    <div class="mfoot"><button class="ghost" id="fR">Back to title</button><button id="fK">Keep exploring</button></div>`);
  paintBadges(); $('#fK').onclick=closeModal; $('#fR').onclick=()=>{ closeModal(); toTitle(); };
  $('#cp').onclick=()=>{ const b=$('#cp'); const done=()=>{ b.textContent='Copied'; }; try{ navigator.clipboard.writeText(PROFILE.email).then(done,()=>{ sel(); }); }catch(e){ sel(); }
    function sel(){ const r=document.createRange(); r.selectNodeContents($('#em')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Selected'; } }; }

/* ===================== title & flow ===================== */
function toTitle(){ mode='title'; hidePrompt(); $('#hud').hidden=true; $('#tracker').hidden=true; $('#help').hidden=true; $('#touch').hidden=true; $('#title').hidden=false; $('#tWarn').hidden=true;
  loadScene('town'); $('#tCont').hidden=!hasSave; $('#tStart').textContent=hasSave?'New Adventure':'Start Adventure'; }
function startPlay(fresh){ Snd.init(); Snd.startMusic(); if(fresh){ wipe(); }
  $('#title').hidden=true; mode='play'; $('#hud').hidden=false; $('#help').hidden=isTouch(); $('#touch').hidden=!isTouch();
  loadScene(S.scene||'town'); P.x=S.x; P.y=S.y; P.dir=S.dir||'up'; if(collides(P.x,P.y)){ loadScene('town'); P.x=18*T; P.y=16*T+12; }
  snapCam(); updateTracker(); syncSound(); $('#app').focus({preventScroll:true});
  if(fresh) setTimeout(()=>sayLines('Narrator',['Welcome to Avin Town.','Here lives a Textile Technology student who somehow ended up exploring consulting, startups, venture capital, analytics, research and everything in between.','Your mission? Explore the town, uncover his story, collect achievements, and find out where his next adventure might take him.'],null,null,()=>{ toast('TIP','Talk to Tara, the guide on your left','people','#3fa37a'); }),250);
  save(); }
function isTouch(){ return matchMedia('(pointer: coarse)').matches || innerWidth<700; }
$('#tStart').onclick=()=>{ if(hasSave){ $('#tWarn').hidden=false; return; } startPlay(true); };
$('#tYes').onclick=()=>startPlay(true);
$('#tCont').onclick=()=>startPlay(false);
$('#tHow').onclick=()=>{ openModal(howToHTML()+'<div class="mfoot"><button id="mX">Got it</button></div>'); $('#mX').onclick=closeModal; };
function syncSound(){ $('#bS').textContent='Sound: '+(S.sound?'on':'off'); }
$('#bS').onclick=()=>{ Snd.init(); S.sound=!S.sound; syncSound(); save(); };
document.querySelectorAll('#btns button').forEach(b=>b.addEventListener('click',()=>b.blur()));
$('#bJ').onclick=()=>{ if(!dlgOpen) openJournal(); }; $('#bP').onclick=()=>{ if(!dlgOpen) openProfile(); }; $('#bM').onclick=()=>{ if(!dlgOpen) openMap(); }; $('#bE').onclick=()=>{ if(!dlgOpen&&!modalOpen) openMenu(); };

/* ===================== input ===================== */
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{ const k=KEYMAP[e.code];
  const onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(k) e.preventDefault(); else if(e.code==='Space' && !(onBtn && (modalOpen||mode!=='play'))) e.preventDefault();
  if(e.code==='Escape'){ if(dlgOpen) skipDlg(); else if(modalOpen){ if(modalClose) closeModal(); } else if(mode==='play') openMenu(); return; }
  if(modalOpen||mode!=='play') return;
  if(dlgOpen){ if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(!e.repeat) advance(); } return; }
  if(k){ K[k]=1; return; }
  if((e.code==='KeyE'||e.code==='Space'||e.code==='Enter')&&!e.repeat){ e.preventDefault(); interact(); }
  if(e.code==='KeyJ') openJournal(); if(e.code==='KeyP') openProfile(); if(e.code==='KeyM') openMap(); });
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) K[k]=0; });
addEventListener('blur',()=>{ K.up=K.down=K.left=K.right=0; });
document.querySelectorAll('#dpad button').forEach(b=>{ const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); Snd.init(); K[k]=1; b.setPointerCapture(e.pointerId); });
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{ K[k]=0; })); });
$('#abtn').addEventListener('pointerdown',e=>{ e.preventDefault(); if(dlgOpen) advance(); else interact(); });
$('#dlg').addEventListener('click',e=>{ if(e.target.tagName!=='BUTTON') advance(); });

/* ===================== boot ===================== */
let last=performance.now();
function frame(t){ const dt=Math.min(.05,(t-last)/1000); last=t; update(dt,t/1000); render(t/1000); requestAnimationFrame(frame); }
resize(); toTitle(); requestAnimationFrame(frame);
window.__AQ = { S:()=>S, P, K, scene:()=>scene, goTo, interact, progress, completeQuest, futureOpen };
</script>

</body>
</html>
